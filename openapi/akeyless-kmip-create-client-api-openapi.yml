    kmipCreateClientOutput:
      example:
        certificate: certificate
        id: id
        key: key
      properties:
        certificate:
          type: string
          x-go-name: Certificate
        id:
          type: string
          x-go-name: ID
        key:
          type: string
          x-go-name: Key
      type: object
      x-go-package: akeyless.io/akeyless-main-repo/go/src/client/commands
    JSONError:
      properties:
        error:
          type: string
          x-go-name: Err
      title: JSONError wraps an error with JSON object.
      type: object
