              $ref: '#/components/schemas/kmipCreateClient'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kmipCreateClientOutput'
          description: kmipCreateClientResponse wraps response body.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
          description: 'errorResponse wraps any error to return it as a JSON object with one "error"

            field.'
      tags:
      - Kmip Create Client
      x-codegen-request-body-name: body
      summary: Kmip create client
      x-summary-source: derived
components:
  schemas:
    kmipCreateClient:
      properties:
        activate-keys-on-creation:
          type: string
