openapi: 3.2.0
info:
  contact:
    email: support@akeyless.io
    name: Akeyless
    url: http://akeyless.io
  description: The purpose of this application is to provide access to Akeyless API.
  title: Akeyless Update Github Target API
  version: '2.0'
servers:
- url: https://api.akeyless.io/
tags:
- name: Update Github Target
paths:
  /update-github-target:
    post:
      operationId: updateGithubTarget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateGithubTarget'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateGithubTargetOutput'
          description: updateGithubTargetResponse wraps response body.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
          description: 'errorResponse wraps any error to return it as a JSON object with one "error"

            field.'
      tags:
      - Update Github Target
      x-codegen-request-body-name: body
      summary: Update github target
      x-summary-source: derived
components:
  schemas:
    updateGithubTargetOutput:
      example:
        target_id: 0
      properties:
        target_id:
          format: int64
          type: integer
          x-go-name: TargetID
      type: object
      x-go-package: akeyless.io/akeyless-main-repo/go/src/client/commands
    updateGithubTarget:
      properties:
        comment:
          description: Deprecated - use description
          type: string
          x-go-name: Comment
        description:
          description: Description of the object
          type: string
          x-go-name: Description
        github-app-id:
          description: Github app id
          format: int64
          type: integer
          x-go-name: AppId
        github-app-private-key:
          description: App private key
          type: string
          x-go-name: AppPrivateKey
        github-base-url:
          description: Base URL
          type: string
          x-go-name: BaseUrl
        json:
          description: Set output format to JSON
          type: boolean
          x-go-name: Json
        keep-prev-version:
          type: string
          x-go-name: KeepPrevVersion
        key:
          description: 'The name of a key that used to encrypt the target secret value (if empty, the

            account default protectionKey key will be used)'
          type: string
          x-go-name: ProtectionKey
        name:
          description: Target name
          type: string
          x-go-name: TargetName
        new-name:
          description: New target name
          type: string
          x-go-name: NewTargetName
        token:
          description: Authentication token (see `/auth` and `/configure`)
          type: string
          x-go-name: Profile
        uid-token:
          description: The universal identity token, Required only for universal_identity authentication
          type: string
          x-go-name: UIDToken
        update-version:
