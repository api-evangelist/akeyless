      x-go-package: akeyless.io/akeyless-main-repo/go/src/client/commands
    verifyJWTWithClassicKey:
      properties:
        display-id:
          description: The name of the key to use in the verify JWT process
          type: string
          x-go-name: DisplayId
        json:
          description: Set output format to JSON
          type: boolean
          x-go-name: Json
        jwt:
          description: JWT
          type: string
