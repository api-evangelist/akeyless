              schema:
                $ref: '#/components/schemas/verifyJWTOutput'
          description: verifyJWTWithClassicKeyResponse wraps response body.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONError'
          description: 'errorResponse wraps any error to return it as a JSON object with one "error"

            field.'
      tags:
      - Verify Jwt With Classic Key
      x-codegen-request-body-name: body
      summary: Verify JWT with classic key
      x-summary-source: derived
components:
  schemas:
